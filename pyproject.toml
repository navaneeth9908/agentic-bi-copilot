[project]
name = "agentic-bi-copilot"
version = "0.1.0"
description = "Agentic BI copilot that answers business questions with safe SQL, RAG-backed metric definitions, and evaluation tests."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sai Navaneeth Thota" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_bi_copilot"]

[project.scripts]
bi-copilot = "agentic_bi_copilot.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
